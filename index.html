.hero{padding:10px 0 22px}.hero p{color:var(--pl);margin:0}.hero b{color:var(--az)}

.card ul{list-style:none;padding:0;margin:0 0 14px}

.pr{display:grid;gap:6px;margin-bottom:14px;border-top:1px solid var(--as);padding-top:12px}

.btn,.mini{display:inline-block;background:var(--az);color:var(--ca);border:0;padding:11px 18px;font:inherit;font-weight:800;text-transform:uppercase;text-decoration:none;cursor:pointer;letter-spacing:.05em;text-align:center}
.mini{padding:6px 10px;font-size:.72rem;background:none;color:var(--az);border:1px solid var(--az)}
.btn:disabled,.chip.off,.sl.off{opacity:.35;cursor:not-allowed}
.ex{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip,.sl{border:1px solid var(--pl);background:none;color:var(--bl);padding:8px 12px;font:inherit;font-size:.8rem;cursor:pointer;display:inline-block}
.chip.on,.sl.on{background:var(--az);color:var(--ca);border-color:var(--az)}
.chip i{color:var(--pl);cursor:pointer;margin-left:6px;font-style:normal}
.tot{color:var(--az);font-weight:800}
.note{border-left:3px solid var(--az);padding:8px 12px;color:var(--pl);margin:10px 0}
.day{margin-bottom:12px}.slot{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--as);flex-wrap:wrap}
.slot .t{color:var(--az);font-weight:800;width:54px}.slot .inf{flex:1;min-width:140px}.slot.bk .inf{color:var(--pl)}.slot.tk{background:color-mix(in srgb,var(--as) 35%,transparent)}

<script>

const msgR=(c,l)=>`${S.promo}\n\nTu último lavado fue el ${fdl(l)}. Si querés agendar tu próximo turno, entrá acá: ${link()}#turnos`;
const gcal=t=>{const k=t.date.replace(/-/g,""),h=+t.time.slice(0,2),m=t.time.slice(3),f=x=>k+"T"+pad(x)+m+"00";return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Final Touch · "+t.svc+" · "+t.name)+"&dates="+f(h)+"/"+f(Math.min(h+2,23))+"&details="+encodeURIComponent(t.veh+(t.x||[]).map(i=>" + "+X[i][0]).join("")+" · "+t.phone)+"&location="+encodeURIComponent(t.addr||"")};
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",2800)}
async function save(pub=true){try{S.busy=D.turns.map(x=>x.date+"|"+x.time);const db=await claude.use("db");await db.doc("priv/main").set(D);if(!pub){R();return}const c=document.documentElement.cloneNode(true);c.querySelector("#state").textContent=JSON.stringify(S).replace(/</g,"\\u003c");c.querySelectorAll("[data-dyn]").forEach(e=>e.innerHTML="");await art.publish("<!DOCTYPE html>"+c.outerHTML)}catch(e){toast("No se pudo guardar. Abrí la página con tu cuenta.")}}
const v=id=>($("#"+id)||{}).value||"";
const slotsOf=d=>[...new Set(S.slots.concat(D.turns.filter(x=>x.date===d).map(x=>x.time)))].sort();
const opts=(a,c)=>a.map(x=>`<option${x===c?" selected":""}>${x}</option>`).join("");
const VIEW={
servicios:()=>`<div class="hero"><h1>Lavado premium <b>a domicilio</b></h1><p>Vamos hasta tu casa. Elegí tu servicio y reservá tu turno.</p></div><div class="grid">`+Object.keys(P).map(n=>`<article class="card"><h2>${n}</h2><ul>${P[n].i.map(x=>`<li>${x}</li>`).join("")}</ul><div class="pr">${V.map((w,j)=>`<div><span>${w}</span><b>${$m(P[n].p[j])}</b></div>`).join("")}</div><a class="btn" href="#turnos" data-act="pick" data-a="${n}">Reservar ${n}</a></article>`).join("")+`</div><h3 style="margin-top:22px">Extras</h3><div class="ex">${X.map(x=>`<div><span>${x[0]}</span><b>${$m(x[1])}</b></div>`).join("")}</div>`,
turnos:()=>{const days=[];for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()+i);days.push(iso(d))}
return `<h1>Reservá tu turno</h1><div class="form"><div class="grid"><label>Servicio<select data-s="svc">${opts(Object.keys(P),sel.svc)}</select></label><label>Vehículo<select data-s="veh">${opts(V,sel.veh)}</select></label></div><h3>Extras (opcional)</h3><div class="chips">${X.map((x,i)=>`<label class="chip${(sel.x||[]).includes(i)?" on":""}" style="display:inline-flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" style="width:auto" data-x="${i}"${(sel.x||[]).includes(i)?" checked":""}>${x[0]} · ${$m(x[1])}</label>`).join("")}</div><div class="tot">${sel.svc} · ${sel.veh}${(sel.x||[]).map(i=>" + "+X[i][0]).join("")}: ${$m(P[sel.svc].p[V.indexOf(sel.veh)]+(sel.x||[]).reduce((a,i)=>a+X[i][1],0))}</div><div class="grid"><label>Nombre<input data-f="name" value="${esc(sel.name)}"></label><label>Teléfono<input data-f="phone" inputmode="tel" value="${esc(sel.phone)}"></label></div><label>Dirección<input data-f="addr" value="${esc(sel.addr)}"></label><label>Nota (opcional)<input data-f="note" value="${esc(sel.note)}"></label></div><h3>Elegí el día</h3><div class="chips">${days.map(d=>`<button class="chip${sel.date===d?" on":""}" data-act="day" data-a="${d}">${fd(d)}</button>`).join("")}</div>`+(sel.date?`<h3>Elegí el horario</h3><div class="chips">${S.slots.map(t=>{const off=taken(sel.date,t)||blk(sel.date,t)||past(sel.date,t);return `<button class="sl${sel.time===t?" on":""}${off?" off":""}" ${off?"disabled":`data-act="slot" data-a="${t}"`}>${t} hs${off?" · ocupado":""}</button>`}).join("")}</div>`:"")+`<p class="note">Al reservar se abre WhatsApp con tu pedido ya escrito. Te confirmamos el turno por ahí. Ese día solo necesitamos una canilla y un enchufe.</p><button class="btn" data-act="book">Reservar por WhatsApp</button>`+(own&&!S.wa?`<p class="note">Cargá tu número de WhatsApp en Ajustes para que las reservas te lleguen.</p>`:"")},
agenda:()=>{const m=new Date();m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7)+off*7);const days=[...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return iso(d)});
return `<h1>Agenda de la semana</h1><div class="wk"><button class="mini" data-act="week" data-a="-1">‹ Anterior</button><b>${fdl(days[0])} al ${fdl(days[6])}</b><button class="mini" data-act="week" data-a="1">Siguiente ›</button></div>`+days.map(d=>`<div class="day"><h3>${fd(d)}</h3>${slotsOf(d).map(t=>{const k=taken(d,t),b=blk(d,t);return `<div class="slot${k?" tk":b?" bk":""}"><span class="t">${t}</span>`+(k?`<div class="inf"><b>${esc(k.name)}</b> · ${esc(k.svc)} ${esc(k.veh)}${(k.x||[]).map(i=>" + "+esc(X[i][0])).join("")}<small>${esc(k.phone)} · ${esc(k.addr)}</small></div><div class="ac"><a class="mini" target="_blank" rel="noopener" href="${wa(k.phone,msgC(k))}">Confirmar</a><a class="mini" target="_blank" rel="noopener" href="${gcal(k)}">Calendar</a><button class="mini" data-act="deltn" data-a="${k.id}">Quitar</button></div>`:`<div class="inf">${b?"Bloqueado":"Libre"}</div><div class="ac"><button class="mini" data-act="blk" data-a="${d}|${t}">${b?"Liberar":"Bloquear"}</button></div>`)+"</div>"}).join("")}</div>`).join("")+`<h3 style="margin-top:20px">Agendar un turno a mano</h3><div class="form row"><label>Día<input type="date" id="a_d"></label><label>Hora<select id="a_t">${opts(S.slots)}</select></label><label>Nombre<input id="a_n"></label><label>Teléfono<input id="a_p" inputmode="tel"></label><label>Dirección<input id="a_a"></label><label>Servicio<select id="a_s">${opts(Object.keys(P))}</select></label><label>Vehículo<select id="a_v">${opts(V)}</select></label><div class="chips" style="grid-column:1/-1">${X.map((x,i)=>`<label class="chip" style="display:inline-flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" style="width:auto" id="a_x${i}">${x[0]}</label>`).join("")}</div><button class="btn" data-act="addtn">Agendar</button></div>`},
clientes:()=>`<h1>Clientes</h1><div class="form row"><label>Nombre<input id="c_n"></label><label>Teléfono con código (ej. 5492610000000)<input id="c_p" inputmode="tel"></label><button class="btn" data-act="addc">Agregar cliente</button></div>`+(D.clients.length?"":`<p class="note">Todavía no cargaste clientes.</p>`)+D.clients.map(c=>{const w=[...c.washes].sort(),l=w[w.length-1];return `<div class="cl"><div><b>${esc(c.name)}</b><small>${esc(c.phone)}</small></div><div>${w.map(x=>`<span class="chip">${fdl(x)}<i data-act="delw" data-a="${c.id}|${x}">×</i></span>`).join("")||"<small>Sin lavados cargados</small>"}</div><div class="ac"><input type="date" id="w_${c.id}"><button class="mini" data-act="addw" data-a="${c.id}">Sumar lavado</button>${l?`<a class="mini" target="_blank" rel="noopener" href="${wa(c.phone,msgR(c,l))}">Enviar recordatorio</a>`:""}<button class="mini" data-act="delc" data-a="${c.id}">Eliminar</button></div></div>`}).join(""),
ajustes:()=>`<h1>Ajustes</h1><h3>Precios</h3><div class="form">${Object.keys(P).map(n=>`<div><b>${n}</b><div class="grid">${V.map((w,j)=>`<label>${w}<input id="p_${n}${j}" inputmode="numeric" value="${P[n].p[j]}"></label>`).join("")}</div></div>`).join("")}<div class="grid">${X.map((x,i)=>`<label>${x[0]}<input id="x_${i}" inputmode="numeric" value="${x[1]}"></label>`).join("")}</div></div><h3>General</h3><div class="form"><label>Tu WhatsApp (con código de país, ej. 5492610000000)<input id="s_w" value="${esc(S.wa)}"></label><label>Horarios de turno (separados por coma)<input id="s_s" value="${esc(S.slots.join(", "))}"></label><label>Mensaje de recordatorio para clientes (se le agrega la fecha del último lavado y el link)<textarea id="s_p" rows="3">${esc(S.promo)}</textarea></label><button class="btn" data-act="cfg">Guardar</button></div>`};
function R(){const T=[["servicios","Servicios"],["turnos","Turnos"]].concat(own?[["agenda","Agenda"],["clientes","Clientes"],["ajustes","Ajustes"]]:[]);if(!T.some(t=>t[0]===tab))tab="servicios";$("#nav").innerHTML=T.map(t=>`<a href="#${t[0]}" class="${t[0]===tab?"on":""}">${t[1]}</a>`).join("");$("#app").innerHTML=VIEW[tab]()}
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const H={pick:a=>{sel.svc=a},day:a=>{sel.date=a;sel.time="";R()},slot:a=>{sel.time=a;R()},week:a=>{off+=+a;R()},
book:()=>{if(!(sel.name&&sel.phone&&sel.date&&sel.time))return toast("Completá nombre, teléfono, día y horario");if(!S.wa)return toast("El negocio todavía no cargó su WhatsApp");window.open(wa(S.wa,msgO(sel)),"_blank")},
blk:a=>{const i=S.blocked.indexOf(a);i<0?S.blocked.push(a):S.blocked.splice(i,1);save()},
deltn:a=>{D.turns=D.turns.filter(x=>x.id!==a);save()},
addtn:()=>{const t={id:nid(),date:v("a_d"),time:v("a_t"),name:v("a_n"),phone:v("a_p"),addr:v("a_a"),svc:v("a_s"),veh:v("a_v"),x:X.map((_,i)=>i).filter(i=>$("#a_x"+i)&&$("#a_x"+i).checked)};if(!t.date||!t.name||!t.time)return toast("Falta día, hora o nombre");if(taken(t.date,t.time))return toast("Ese horario ya está ocupado");D.turns.push(t);if(t.phone&&!D.clients.some(c=>c.phone===t.phone))D.clients.push({id:nid(),name:t.name,phone:t.phone,washes:[]});save()},
addc:()=>{if(!v("c_n"))return toast("Falta el nombre");D.clients.push({id:nid(),name:v("c_n"),phone:v("c_p"),washes:[]});save(false)},
delc:a=>{if(confirm("¿Eliminar este cliente?")){D.clients=D.clients.filter(c=>c.id!==a);save(false)}},
addw:a=>{const d=v("w_"+a);if(!d)return toast("Elegí la fecha del lavado");D.clients.find(c=>c.id===a).washes.push(d);save(false)},
delw:a=>{const p=a.split("|"),c=D.clients.find(x=>x.id===p[0]);c.washes=c.washes.filter(x=>x!==p[1]);save(false)},
cfg:()=>{Object.keys(P).forEach(n=>{S.pr[n]=V.map((_,j)=>+v("p_"+n+j).replace(/\D/g,"")||P[n].p[j])});S.ex=X.map((x,i)=>+v("x_"+i).replace(/\D/g,"")||x[1]);S.wa=v("s_w").trim();S.slots=v("s_s").split(",").map(x=>x.trim()).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,"0"));S.promo=v("s_p").trim();save()}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const f=H[b.dataset.act];f&&f(b.dataset.a)});
document.addEventListener("input",e=>{const f=e.target.dataset.f;if(f)sel[f]=e.target.value});
document.addEventListener("change",e=>{const f=e.target.dataset.s;if(f){sel[f]=e.target.value;R()}const x=e.target.dataset.x;if(x!==undefined){const i=+x,a=sel.x||[];sel.x=e.target.checked?[...new Set([...a,i])]:a.filter(k=>k!==i);R()}});
addEventListener("hashchange",()=>{tab=location.hash.slice(1)||"servicios";R()});
tab=location.hash.slice(1)||"servicios";R();
R();
</script>
</body></html>
